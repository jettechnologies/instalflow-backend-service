openapi: 3.0.0
info:
  title: SuperAdmin API
  version: 1.0.0
  description: API for platform management and configuration.

paths:
  /superadmin/overview:
    get:
      summary: Platform-wide dashboard overview
      tags: [SuperAdmin, Revenue]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant counts, platform revenue, GMV, and top tenants/products
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object

  /superadmin/tenants:
    get:
      summary: List all tenants (companies) with headline stats
      tags: [SuperAdmin, Tenants]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Paginated tenant directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      tenants:
                        type: array
                        items:
                          type: object

  /superadmin/tenants/{companyId}:
    get:
      summary: Get a single tenant's full profile
      tags: [SuperAdmin, Tenants]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tenant profile — subscription history, users, financing, KYC funnel, revenue
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Tenant not found

  /superadmin/tenants/{companyId}/status:
    patch:
      summary: Suspend or reactivate a tenant
      description: >
        Enforced by `requireActiveCompany`, wired onto every company-scoped
        mutating route (product, category, variant, installment, commission,
        financing, admin, customer-management, bank/company-bank, kyc,
        company). Reads stay open while SUSPENDED; CUSTOMER is exempt so a
        suspended merchant's customers can still pay off installments they
        already owe. A reason is mandatory when suspending.
      tags: [SuperAdmin, Tenants]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED]
                reason:
                  type: string
                  description: Required when status is SUSPENDED (min 10 characters)
      responses:
        '200':
          description: Tenant status updated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing reason when suspending
        '404':
          description: Tenant not found

  /superadmin/tenants/{companyId}/activity:
    get:
      summary: Unified tenant activity timeline
      description: >
        Fanned in from KYC audit trail, merchant settlement audit trail,
        marketer approval requests, commission payout status changes,
        financing contract lifecycle events, and login sessions. No single
        AuditLog table backs this — each source is queried and merged.
      tags: [SuperAdmin, Tenants]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: type
          schema:
            type: string
            enum: [kyc, settlement, approval, payout, contract, login]
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated, chronologically-sorted activity feed
          content:
            application/json:
              schema:
                type: object

  /superadmin/tenants/{companyId}/revenue:
    get:
      summary: Platform revenue earned from this tenant, plus their GMV
      description: >
        `platformRevenue` is what Instalflow earned from this tenant
        (onboarding fee + subscription renewals, from the PLATFORM_REVENUE
        ledger account). `tenantGmv` is a separate number — money flowing
        through the tenant's own products. The two are never summed.
      tags: [SuperAdmin, Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Itemized platform revenue + tenant GMV + merchant settlement payout total
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Tenant not found

  /superadmin/revenue/tenants:
    get:
      summary: Cross-tenant platform revenue leaderboard
      tags: [SuperAdmin, Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Tenants ranked by platform revenue, with GMV shown alongside
          content:
            application/json:
              schema:
                type: object

  /superadmin/revenue/products:
    get:
      summary: Platform-wide product revenue leaderboard
      description: >
        Cross-tenant version of the company-scoped product performance
        endpoint (`GET /analytics/products/performance`) — every product
        across every tenant, ranked by GMV.
      tags: [SuperAdmin, Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Products ranked by total financed value, with tenant attached
          content:
            application/json:
              schema:
                type: object

  /superadmin/plans:
    get:
      summary: List all subscription plans (Internal)
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionPlan'

    post:
      summary: Create a new subscription plan
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/SubscriptionPlan'

  /superadmin/plans/{planId}:
    patch:
      summary: Update an existing plan
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: Plan updated

    delete:
      summary: Delete a plan
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan deleted

  /superadmin/plans/{planId}/toggle:
    patch:
      summary: Toggle plan status (active/inactive)
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: Status toggled

  /superadmin/ledger/reconciliation/summary:
    get:
      tags:
        - Ledger Reconciliation
      summary: Get latest reconciliation summary
      description: |
        Returns the cached summary of the most recent ledger reconciliation run.
        If the cache is empty (cold), a `cacheStatus: "cold"` indicator is returned.
        The reconciliation worker runs daily at 02:00.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reconciliation summary retrieved from Redis cache.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    oneOf:
                      - type: object
                        properties:
                          cacheStatus:
                            type: string
                            enum: [hot]
                          totalAccounts:
                            type: integer
                          discrepancies:
                            type: integer
                          reconciledAt:
                            type: string
                            format: date-time
                      - type: object
                        properties:
                          cacheStatus:
                            type: string
                            enum: [cold]
                          message:
                            type: string

  /superadmin/ledger/reconciliation/accounts:
    get:
      tags:
        - Ledger Reconciliation
      summary: List all ledger account reconciliation results
      description: |
        Returns per-account reconciliation results from the latest run.
        Reads from Redis cache; accounts without a cached result show `computedBalance: "unchecked"`.
      security:
        - bearerAuth: []
      parameters:
        - name: discrepancyOnly
          in: query
          schema:
            type: string
            enum: [true, false]
          description: |
            Filter to only accounts that had a balance discrepancy in the last run.
            Omit or set to `false` to return all accounts.
        - name: companyId
          in: query
          schema:
            type: string
          description: |
            Filter by company scope. Use `global` for platform-wide accounts, or a company UUID.
            Omit to return all accounts.
      responses:
        '200':
          description: List of account reconciliation results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      cacheStatus:
                        type: string
                        enum: [hot, partial, cold]
                      accounts:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccountReconciliationResult'
                      totalReturned:
                        type: integer

  /superadmin/ledger/reconciliation/accounts/{accountId}:
    get:
      tags:
        - Ledger Reconciliation
      summary: Get reconciliation result for a single ledger account
      description: |
        Returns the reconciliation result for a specific ledger account by its numeric ID.
        Reads from Redis cache; falls back to DB metadata if the cache is cold.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: The numeric LedgerAccount ID.
          example: 1
      responses:
        '200':
          description: Account reconciliation data retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/AccountReconciliationResult'
        '404':
          description: Ledger account not found.

  /superadmin/ledger/reconciliation/cache:
    delete:
      tags:
        - Ledger Reconciliation
      summary: Invalidate reconciliation cache
      description: |
        Purges all reconciliation cache keys from Redis.
        Call this before triggering a manual re-run to prevent stale dashboard reads.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reconciliation cache invalidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      keysDeleted:
                        type: integer

  /superadmin/ledger/corrections:
    post:
      summary: Post a manual ledger correction
      description: >
        The one sanctioned way to correct the ledger outside auto-reconciliation
        (PROJECT_WORKFLOW.md: corrections are reversing entries, never
        edits/deletes). Thin wrapper around the same `LedgerService.recordTransaction()`
        every domain uses — entries must balance (sum of debits == sum of
        credits) or the request is rejected with 400.
      tags: [SuperAdmin, Ledger]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, reason, entries]
              properties:
                description:
                  type: string
                reason:
                  type: string
                  description: Mandatory, min 10 characters — this becomes part of a permanent audit record
                companyId:
                  type: string
                  format: uuid
                  description: Omit for a system-wide account (e.g. correcting PLATFORM_REVENUE at the platform level)
                entries:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [accountName, accountType]
                    properties:
                      accountName:
                        type: string
                        example: PAYSTACK_CLEARING
                      accountType:
                        type: string
                        enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
                      debit:
                        type: number
                      credit:
                        type: number
      responses:
        '201':
          description: Correction posted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unbalanced entries (debits != credits)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubscriptionPlan:
      type: object
      properties:
        planId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discountPrice:
          type: number
        interval:
          type: string
          enum: [WEEKLY, MONTHLY, YEARLY]
        active:
          type: boolean

    CreatePlanRequest:
      type: object
      required:
        - name
        - price
        - interval
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discountPrice:
          type: number
        discountPercentage:
          type: number
        interval:
          type: string
          enum: [WEEKLY, MONTHLY, YEARLY]
        active:
          type: boolean

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        discountPrice:
          type: number
        discountPercentage:
          type: number
        interval:
          type: string
          enum: [WEEKLY, MONTHLY, YEARLY]
        active:
          type: boolean

    AccountReconciliationResult:
      type: object
      properties:
        accountId:
          type: integer
          example: 1
        accountName:
          type: string
          example: PAYSTACK_CLEARING
        companyId:
          type: string
          nullable: true
          example: null
        storedBalance:
          type: string
          example: "1500000.00"
        computedBalance:
          type: string
          example: "1500000.00"
        discrepancy:
          type: boolean
          example: false
        corrected:
          type: boolean
          example: false
        reconciledAt:
          type: string
          format: date-time
          example: "2026-06-29T02:00:00.000Z"
